<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terrain JSON Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #eee;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid #333;
        background: #181818;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      button,
      input {
        font: inherit;
      }

      button {
        padding: 7px 10px;
        border: 1px solid #555;
        border-radius: 4px;
        color: #eee;
        background: #2a2a2a;
        cursor: pointer;
      }

      button:hover {
        background: #363636;
      }

      #status {
        margin-left: auto;
        color: #aaa;
        font-size: 13px;
      }

      main {
        position: relative;
        overflow: auto;
        background: #0b0b0b;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
      }

      .legend {
        position: fixed;
        right: 14px;
        bottom: 14px;
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border: 1px solid #444;
        border-radius: 4px;
        background: rgba(20,20,20,0.88);
        font-size: 12px;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .swatch {
        width: 14px;
        height: 14px;
        border: 1px solid rgba(255,255,255,0.25);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Terrain JSON Viewer</h1>
      <button id="loadDefaultBtn" type="button">칸나에 맵 열기</button>
      <input id="fileInput" type="file" accept=".json,application/json" />
      <button id="zoomOutBtn" type="button">-</button>
      <button id="zoomInBtn" type="button">+</button>
      <span id="status">대기 중</span>
    </header>
    <main>
      <canvas id="mapCanvas"></canvas>
    </main>
    <div id="legend" class="legend"></div>

    <script>
      const canvas = document.getElementById("mapCanvas");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const legendEl = document.getElementById("legend");
      const colors = {
        plain: "#b89a63",
        grassland: "#789b4c",
        road: "#d2b071",
        river: "#4d9ccb",
        wetland: "#4f8f9d",
        mountain: "#58694f",
        unknown: "#d13f3f"
      };
      let terrain = null;
      let cellSize = 4;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function drawLegend() {
        legendEl.innerHTML = "";
        Object.entries(colors).forEach(([key, color]) => {
          if (key === "unknown") return;
          const row = document.createElement("div");
          row.className = "legend-row";
          row.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${key}</span>`;
          legendEl.appendChild(row);
        });
      }

      function drawTerrain() {
        if (!terrain?.tiles?.length) return;
        const h = terrain.tiles.length;
        const w = terrain.tiles[0].length;
        canvas.width = w * cellSize;
        canvas.height = h * cellSize;
        ctx.imageSmoothingEnabled = false;

        for (let y = 0; y < h; y += 1) {
          for (let x = 0; x < w; x += 1) {
            const tile = terrain.tiles[y][x];
            ctx.fillStyle = colors[tile] || colors.unknown;
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }

        setStatus(`${terrain.name || terrain.id || "map"} · ${w}x${h} · zoom ${cellSize}px`);
      }

      async function loadDefault() {
        if (location.protocol === "file:") {
          throw new Error("file://에서는 브라우저 보안 정책 때문에 자동 로드가 막힙니다. 파일 선택으로 JSON을 열어주세요.");
        }
        const res = await fetch("./data/scenarios/cannae_terrain.json");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        terrain = await res.json();
        drawTerrain();
      }

      function loadFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
          terrain = JSON.parse(reader.result);
          drawTerrain();
        };
        reader.onerror = () => setStatus("파일을 읽지 못했습니다.");
        reader.readAsText(file, "utf-8");
      }

      document.getElementById("loadDefaultBtn").addEventListener("click", () => {
        loadDefault().catch((error) => setStatus(`기본 맵 로드 실패: ${error.message}`));
      });

      document.getElementById("fileInput").addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (file) loadFile(file);
      });

      document.getElementById("zoomOutBtn").addEventListener("click", () => {
        cellSize = Math.max(1, cellSize - 1);
        drawTerrain();
      });

      document.getElementById("zoomInBtn").addEventListener("click", () => {
        cellSize = Math.min(12, cellSize + 1);
        drawTerrain();
      });

      drawLegend();
      loadDefault().catch((error) => setStatus(error.message));
    </script>
  </body>
</html>
